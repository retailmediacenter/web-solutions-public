name: TEMP refresh MVP demos

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-refresh-mvp-demos.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified MVP build artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-22a0-81f4-8334-e1210598bc8f/raw?se=2026-10-13T12%3A56%3A25Z&sp=r&sv=2026-02-06&sr=b&scid=3d8f4bd1-170c-5498-aa37-2b0aa78c2e9b&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T04%3A47%3A47Z&ske=2026-10-14T04%3A47%3A47Z&sks=b&skv=2026-02-06&sig=k5DzhFox9GX4SAYA%2BJmpdGJFdVd5JZ/bmrL2Tedl1Pw%3D' -o /tmp/mvp1.zip
          unzip -t /tmp/mvp1.zip >/dev/null

      - name: Replace public repo with verified build
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          unzip -q /tmp/mvp1.zip -d .
          for slug in salon pizzeria auto-service vinoteka namestaj optika; do
            test -s "demo-previews/$slug/index.html"
            grep -q 'ZAŠTO NAM VERUJU' "demo-previews/$slug/index.html"
            grep -q 'Najčešća pitanja' "demo-previews/$slug/index.html"
          done
          test -s showcase/index.html
          test -s index.html

      - name: Commit public MVP build and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github tmp-mvp
          git config user.name 'RMC Web Solutions Deploy'
          git config user.email 'deploy@retailmediacenter.com'
          git add -A
          git commit -m 'Deploy MVP 1.0 public build'
          git push origin main
