name: TEMP refresh MVP demos

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-refresh-mvp-demos.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode refreshed public build files
        shell: bash
        run: |
          set -euo pipefail
          decode(){ echo "DECODING $1 -> $2"; base64 -d "$1" | gzip -d > "$2"; }

          decode tmp-mvp/salon.b64 demo-previews/salon/index.html
          decode tmp-mvp/pizzeria.b64 demo-previews/pizzeria/index.html
          decode tmp-mvp/auto-service.b64 demo-previews/auto-service/index.html
          decode tmp-mvp/vinoteka.b64 demo-previews/vinoteka/index.html
          decode tmp-mvp/namestaj.b64 demo-previews/namestaj/index.html
          decode tmp-mvp/optika.b64 demo-previews/optika/index.html

          decode tmp-mvp/visual-system.b64 visual-system.css
          decode tmp-mvp/booking-runtime.b64 booking-runtime.js
          decode tmp-mvp/booking-css.b64 booking.css
          decode tmp-mvp/site-system-css.b64 site-system.css
          decode tmp-mvp/site-system-js.b64 site-system.js
          decode tmp-mvp/export-runtime.b64 export-runtime.js
          decode tmp-mvp/global-modal-css.b64 global-modal.css
          decode tmp-mvp/global-modal-js.b64 global-modal.js

          for slug in salon pizzeria auto-service vinoteka namestaj optika; do
            test -s "demo-previews/$slug/index.html"
            grep -q 'ZAŠTO NAM VERUJU' "demo-previews/$slug/index.html"
            grep -q 'Najčešća pitanja' "demo-previews/$slug/index.html"
          done

          grep -q 'V48.7.1 structured-module style parity' visual-system.css
          test -s booking-runtime.js
          test -s booking.css
          test -s site-system.css
          test -s site-system.js
          test -s export-runtime.js
          test -s global-modal.css
          test -s global-modal.js

      - name: Commit refreshed build and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tmp-mvp
          rm -f .github/workflows/tmp-refresh-mvp-demos.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'RMC Web Solutions Deploy'
          git config user.email 'deploy@retailmediacenter.com'
          git add -A
          git commit -m 'Deploy refreshed MVP 1.0 public build'
          git push origin main
