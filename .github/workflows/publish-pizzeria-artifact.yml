name: Deploy verified Pizzeria artifact

on:
  push:
    paths:
      - '.github/workflows/publish-pizzeria-artifact.yml'

permissions:
  contents: write

jobs:
  deploy-pizzeria:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4

      - name: Download verified Pizzeria build
        run: |
          curl -fL 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-7eb0-81f4-a273-7eba6a4b7f59/raw?se=2026-10-13T16%3A55%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=41e085ac-a692-5ad8-8b3d-423d201e5264&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-13T03%3A50%3A35Z&ske=2026-10-14T03%3A50%3A35Z&sks=b&skv=2026-02-06&sig=UKz5zcRo8tTeMrYmStHyE0fMeLhw2ICZj66YEMArFJ0%3D' -o /tmp/pizzeria.zip
          rm -rf /tmp/pizzeria-build
          mkdir -p /tmp/pizzeria-build
          unzip -q /tmp/pizzeria.zip -d /tmp/pizzeria-build

      - name: Replace only Pizzeria demo
        run: |
          rm -rf demo-previews/pizzeria
          mkdir -p demo-previews/pizzeria
          cp -a /tmp/pizzeria-build/. demo-previews/pizzeria/
          git config user.name 'RMC Web Solutions Deploy'
          git config user.email 'deploy@retailmediacenter.com'
          git add demo-previews/pizzeria
          git commit -m 'Deploy verified Pizzeria showcase' || exit 0
          git push origin main
