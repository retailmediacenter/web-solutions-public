name: Install current Advisor QA bundle

on:
  push:
    paths:
      - '.github/workflows/install-advisor-qa.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Advisor QA bundle
        run: |
          curl -L --fail --retry 3 'https://sdmntprukwest.oaiusercontent.com/files/00000000-2594-8243-bfb1-1c4368e0b0e9/raw?se=2026-10-15T13%3A17%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=d3464199-a5a5-596e-a576-3bd213e40969&skoid=9b41a688-1b44-4731-856e-b0efcf3660ed&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-15T04%3A14%3A41Z&ske=2026-10-16T04%3A14%3A41Z&sks=b&skv=2026-02-06&sig=Cp1kS4u8uhavNLmSYWb4/4jxfuK0kLkoNMSFgdZrGig%3D' -o /tmp/advisor-qa.zip
          rm -rf /tmp/advisor-qa
          mkdir -p /tmp/advisor-qa
          unzip -q /tmp/advisor-qa.zip -d /tmp/advisor-qa
          test -f /tmp/advisor-qa/index.html
          test -f /tmp/advisor-qa/assets/index-BwFXZfod.js
          test -f /tmp/advisor-qa/assets/index-al3Ouy7_.css
      - name: Install isolated QA frontend
        run: |
          mkdir -p advisor-qa assets
          cp /tmp/advisor-qa/index.html advisor-qa/index.html
          cp /tmp/advisor-qa/assets/index-BwFXZfod.js assets/index-BwFXZfod.js
          cp /tmp/advisor-qa/assets/index-al3Ouy7_.css assets/index-al3Ouy7_.css
          grep -q 'rmc-web-solutions-api-staging.onrender.com' assets/index-BwFXZfod.js
          grep -q 'Na kojoj adresi se nalazi restoran' assets/index-BwFXZfod.js
      - name: Commit QA frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add advisor-qa/index.html assets/index-BwFXZfod.js assets/index-al3Ouy7_.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish current Advisor QA frontend'
          git push
